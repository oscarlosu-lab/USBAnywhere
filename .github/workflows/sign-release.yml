name: Sign Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build-and-sign:
    name: Build and sign Windows installer
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 9
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "9.0.x"

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build release packages
        shell: pwsh
        run: ./client/Publish-Release.ps1

      - name: Verify installer exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem "client/release/USBAnywhere_Setup_v*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Setup installer not found in client/release/" }
          Write-Host "Built installer: $($installer.FullName)"

      - name: Upload unsigned installer
        id: unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-installer
          path: client/release/USBAnywhere_Setup_v*.exe
          if-no-files-found: error

      - name: Submit signing request
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 3cdf9cc6-5fab-4f37-9426-2795a3ece314
          project-slug: USBAnywhere
          signing-policy-slug: test-signing
          artifact-configuration-slug: initial
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-completion: true
          output-artifact-directory: signed
          skip-decompress: true

      - name: Upload signed installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-installer
          path: signed/**
          if-no-files-found: error
