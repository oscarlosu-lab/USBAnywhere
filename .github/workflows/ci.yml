name: CI Build & Zero-Trust Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & xUnit Tests (.NET 9 Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore USBAnywhere.sln

      - name: Build Release
        run: dotnet build USBAnywhere.sln -c Release --no-restore

      - name: Run Unit Tests (147 xUnit Tests)
        run: dotnet test USBAnywhere.sln -c Release --no-build --verbosity normal
